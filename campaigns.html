<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="JLSPT streaming campaigns, progress, milestones, and missions."
    >

    <title>Campaigns | JLSPT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="nav-inner">

        <a
            href="index.html"
            class="nav-brand"
            aria-label="JLSPT Home"
        >
            <span class="nav-logo">JLSPT</span>
        </a>

        <nav
            class="nav-links"
            aria-label="Main navigation"
        ></nav>

    </div>
</header>


<main>

    <!-- =================================================
         HERO
         ================================================= -->

    <section class="page-hero">
        <div class="container">

            <div class="page-hero-content">

                <span class="eyebrow">
                    JLSPT STREAMING
                </span>

                <h1>
                    Campaigns
                </h1>

                <p>
                    Follow official JLSPT streaming campaigns,
                    track progress, support milestones, and complete missions.
                </p>

            </div>

        </div>
    </section>


    <!-- =================================================
         FILTERS
         ================================================= -->

    <section class="section">
        <div class="container">

            <div class="filters" aria-label="Campaign filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="music"
                >
                    Music
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="video"
                >
                    Video
                </button>

            </div>


            <!-- =========================================
                 CAMPAIGNS
                 ========================================= -->

            <div
                id="campaign-list"
                class="grid grid-2"
            ></div>

        </div>
    </section>

</main>


<footer>

    <div class="footer-inner">

        <div>
            <div class="footer-brand">
                JLSPT
            </div>

            <div class="footer-text">
                JL Streaming Project Team
            </div>
        </div>

        <div class="footer-text">
            Stream. Support. Stay connected.
        </div>

    </div>

</footer>


<script src="data.js"></script>
<script src="menu.js"></script>

<script>
(function () {

    "use strict";


    let currentFilter = "all";


    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatNumber(value) {
        return Number(value || 0).toLocaleString();
    }


    function getProgress(current, goal) {

        if (!goal || goal <= 0) {
            return 0;
        }

        return Math.min(
            100,
            Math.max(
                0,
                (Number(current || 0) / Number(goal)) * 100
            )
        );
    }


    function formatDate(value) {

        if (!value) {
            return "";
        }

        const date =
            new Date(value + "T00:00:00");

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleDateString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );
    }


    function getStatusLabel(status) {

        if (!status) {
            return "ACTIVE";
        }

        return String(status)
            .replace(/-/g, " ")
            .toUpperCase();
    }


    function renderMilestones(milestones) {

        if (
            !Array.isArray(milestones) ||
            !milestones.length
        ) {
            return "";
        }


        return `
            <div
                style="
                    margin-top:24px;
                    font-size:0.74rem;
                    font-weight:900;
                    color:var(--muted);
                    letter-spacing:0.08em;
                    text-transform:uppercase;
                "
            >
                Milestones
            </div>

            <div class="milestones">

                ${milestones.map(
                    function (milestone) {

                        const status =
                            milestone.status || "upcoming";

                        let statusText =
                            "UPCOMING";

                        if (status === "completed") {
                            statusText = "REACHED";
                        }

                        if (status === "current") {
                            statusText = "CURRENT";
                        }

                        return `
                            <div
                                class="
                                    milestone
                                    ${escapeHTML(status)}
                                "
                            >

                                <span class="milestone-label">
                                    ${escapeHTML(
                                        milestone.label ||
                                        formatNumber(
                                            milestone.value
                                        )
                                    )}
                                </span>

                                <span class="milestone-status">
                                    ${statusText}
                                </span>

                            </div>
                        `;

                    }
                ).join("")}

            </div>
        `;
    }


    function renderMissions(missions) {

        if (
            !Array.isArray(missions) ||
            !missions.length
        ) {
            return "";
        }


        return `
            <div
                style="
                    margin-top:24px;
                    font-size:0.74rem;
                    font-weight:900;
                    color:var(--muted);
                    letter-spacing:0.08em;
                    text-transform:uppercase;
                "
            >
                Missions
            </div>

            <div class="mission-list">

                ${missions.map(
                    function (mission) {

                        return `
                            <div class="mission">

                                <strong>
                                    ${escapeHTML(
                                        mission.title
                                    )}
                                </strong>

                                <p>
                                    ${escapeHTML(
                                        mission.description || ""
                                    )}
                                </p>

                            </div>
                        `;

                    }
                ).join("")}

            </div>
        `;
    }


    function renderCampaign(campaign) {

        const progress =
            getProgress(
                campaign.current,
                campaign.goal
            );


        const status =
            campaign.status || "active";


        const statusClass =
            status === "active"
                ? "status-active"
                : (
                    status === "completed"
                        ? "status-completed"
                        : (
                            status === "paused"
                                ? "status-paused"
                                : "status-upcoming"
                        )
                );


        const dateParts = [];


        if (campaign.startDate) {
            dateParts.push(
                "Start: " +
                formatDate(campaign.startDate)
            );
        }


        if (campaign.endDate) {
            dateParts.push(
                "End: " +
                formatDate(campaign.endDate)
            );
        }


        return `
            <article
                class="
                    card
                    campaign-card
                    ${
                        status === "active"
                            ? "card-featured"
                            : ""
                    }
                "
                data-campaign-type="${escapeHTML(
                    campaign.type || ""
                )}"
            >

                <div class="campaign-header">

                    <div>

                        <span
                            class="
                                status-badge
                                ${statusClass}
                            "
                        >
                            ${getStatusLabel(status)}
                        </span>

                        <h2 class="campaign-title">
                            ${escapeHTML(
                                campaign.title
                            )}
                        </h2>

                        <p class="campaign-description">
                            ${escapeHTML(
                                campaign.description || ""
                            )}
                        </p>

                    </div>

                    ${
                        campaign.platform
                            ? `
                                <span class="category-badge">
                                    ${escapeHTML(
                                        campaign.platform
                                    )}
                                </span>
                            `
                            : ""
                    }

                </div>


                <div class="campaign-meta">

                    ${
                        campaign.artist
                            ? `
                                <span class="tag">
                                    ${escapeHTML(
                                        campaign.artist
                                    )}
                                </span>
                            `
                            : ""
                    }

                    ${
                        campaign.release
                            ? `
                                <span class="tag">
                                    ${escapeHTML(
                                        campaign.release
                                    )}
                                </span>
                            `
                            : ""
                    }

                    ${
                        campaign.type
                            ? `
                                <span class="tag">
                                    ${escapeHTML(
                                        campaign.type
                                    )}
                                </span>
                            `
                            : ""
                    }

                </div>


                ${
                    dateParts.length
                        ? `
                            <div
                                style="
                                    margin-top:14px;
                                    color:var(--muted);
                                    font-size:0.75rem;
                                "
                            >
                                ${dateParts
                                    .map(
                                        escapeHTML
                                    )
                                    .join(" · ")}
                            </div>
                        `
                        : ""
                }


                <div class="campaign-progress">

                    <div class="progress-label">

                        <span>
                            Progress
                        </span>

                        <strong>
                            ${progress.toFixed(1)}%
                        </strong>

                    </div>


                    <div
                        class="progress-bar"
                        role="progressbar"
                        aria-valuenow="${progress.toFixed(1)}"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >

                        <div
                            class="progress-fill"
                            style="width:${progress}%"
                        ></div>

                    </div>


                    <div class="campaign-numbers">

                        <span>
                            <strong>
                                ${formatNumber(
                                    campaign.current
                                )}
                            </strong>
                            current
                        </span>

                        <span>
                            Goal:
                            <strong>
                                ${formatNumber(
                                    campaign.goal
                                )}
                            </strong>
                        </span>

                    </div>

                </div>


                ${renderMilestones(
                    campaign.milestones
                )}


                ${renderMissions(
                    campaign.missions
                )}


                <div class="hero-actions">

                    ${
                        campaign.videoUrl
                            ? `
                                <a
                                    href="${escapeHTML(
                                        campaign.videoUrl
                                    )}"
                                    class="btn"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Watch Official Video
                                </a>
                            `
                            : ""
                    }


                    ${
                        campaign.guideUrl
                            ? `
                                <a
                                    href="${escapeHTML(
                                        campaign.guideUrl
                                    )}"
                                    class="btn btn-secondary"
                                >
                                    Campaign Guide
                                </a>
                            `
                            : `
                                <a
                                    href="guides.html"
                                    class="btn btn-secondary"
                                >
                                    View Guides
                                </a>
                            `
                    }

                </div>

            </article>
        `;
    }


    function renderCampaigns() {

        const container =
            document.getElementById(
                "campaign-list"
            );


        if (!container) {
            return;
        }


        const campaigns =
            Array.isArray(JLSPT_DATA.campaigns)
                ? JLSPT_DATA.campaigns
                : [];


        const filtered =
            campaigns.filter(
                function (campaign) {

                    if (currentFilter === "all") {
                        return true;
                    }

                    return campaign.type === currentFilter;
                }
            );


        if (!filtered.length) {

            container.innerHTML = `
                <div class="empty-state">

                    <div class="empty-state-icon">
                        📭
                    </div>

                    <h3>
                        No campaigns in this category
                    </h3>

                    <p>
                        More JLSPT streaming campaigns will appear here.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            filtered
                .map(renderCampaign)
                .join("");
    }


    function setupFilters() {

        const buttons =
            document.querySelectorAll(
                "[data-filter]"
            );


        buttons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        currentFilter =
                            button.dataset.filter;


                        buttons.forEach(
                            function (item) {
                                item.classList.toggle(
                                    "active",
                                    item === button
                                );
                            }
                        );


                        renderCampaigns();
                    }
                );

            }
        );
    }


    function initCampaigns() {

        if (
            typeof JLSPT_DATA === "undefined"
        ) {
            console.error(
                "JLSPT_DATA is not available."
            );

            return;
        }


        renderCampaigns();
        setupFilters();
    }


    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initCampaigns
        );

    } else {

        initCampaigns();

    }

})();
</script>

</body>
</html>
