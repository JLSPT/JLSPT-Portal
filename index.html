<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="JLSPT official portal for JL and AHOF streaming activities, campaigns, guides, schedules, and community updates."
    >

    <title>JLSPT | JL Streaming Project Team</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ==================================================
           HOME DASHBOARD
           Home-specific card styling
        ================================================== */

        .home-section {
            padding: 72px 0;
        }

        .home-section-header {
            margin-bottom: 28px;
        }

        .home-section-header h2 {
            margin: 0 0 8px;
        }

        .home-section-header p {
            margin: 0;
        }

        .home-card-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .home-card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 28px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(255, 255, 255, 0.018)
                );
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            overflow: hidden;
        }

        .home-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(
                90deg,
                #c1122f,
                #e63950
            );
        }

        .home-card:hover {
            border-color: rgba(230, 57, 80, 0.42);
            transform: translateY(-2px);
            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .home-card-label {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            margin-bottom: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(193, 18, 47, 0.13);
            border: 1px solid rgba(230, 57, 80, 0.25);
            color: #ff8b9a;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .home-card h3 {
            margin: 0 0 12px;
            font-size: 1.35rem;
            line-height: 1.25;
        }

        .home-card p {
            margin: 0;
            color: rgba(255, 255, 255, 0.68);
            line-height: 1.65;
        }

        .campaign-card {
            grid-column: span 2;
        }

        .campaign-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .campaign-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .home-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(43, 194, 122, 0.10);
            border: 1px solid rgba(43, 194, 122, 0.24);
            color: #79e0ad;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .home-status::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #79e0ad;
            box-shadow: 0 0 10px rgba(121, 224, 173, 0.65);
        }

        .home-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.68);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .campaign-artist {
            margin-bottom: 7px;
            color: #ff8b9a;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .campaign-description {
            max-width: 760px;
        }

        .home-progress {
            margin-top: 26px;
        }

        .home-progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 9px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.9rem;
        }

        .home-progress-meta strong {
            color: #ffffff;
            font-size: 1rem;
        }

        .home-progress-track {
            width: 100%;
            height: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .home-progress-bar {
            height: 100%;
            min-width: 3px;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #c1122f,
                #e63950,
                #ff6b7d
            );
            box-shadow: 0 0 18px rgba(230, 57, 80, 0.28);
        }

        .home-goal {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 9px;
            color: rgba(255, 255, 255, 0.48);
            font-size: 0.78rem;
        }

        .home-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 17px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 800;
            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                background 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .home-btn-primary {
            background: #c1122f;
            color: #ffffff;
        }

        .home-btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.13);
            color: #ffffff;
        }

        .corner-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .pinned-badge {
            flex-shrink: 0;
            padding: 6px 9px;
            border-radius: 999px;
            background: rgba(230, 57, 80, 0.12);
            border: 1px solid rgba(230, 57, 80, 0.25);
            color: #ff8b9a;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.07em;
        }

        .corner-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.42);
            font-size: 0.78rem;
        }

        .corner-content {
            margin-top: 18px;
        }

        .corner-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .station-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
        }

        .station-copy {
            max-width: 720px;
        }

        .station-icon {
            flex-shrink: 0;
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: rgba(193, 18, 47, 0.14);
            border: 1px solid rgba(230, 57, 80, 0.25);
            font-size: 1.5rem;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .overview-card {
            padding: 24px;
        }

        .overview-card h3 {
            font-size: 1.1rem;
        }

        .overview-card p {
            font-size: 0.92rem;
        }

        .empty-home-card {
            grid-column: 1 / -1;
        }

        @media (max-width: 860px) {

            .home-section {
                padding: 52px 0;
            }

            .home-card-grid {
                grid-template-columns: 1fr;
            }

            .campaign-card {
                grid-column: span 1;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .station-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .station-icon {
                order: -1;
            }

        }

        @media (max-width: 560px) {

            .home-card {
                padding: 22px;
                border-radius: 15px;
            }

            .home-card h3 {
                font-size: 1.2rem;
            }

            .campaign-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .corner-card-header {
                flex-direction: column;
            }

            .corner-footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .home-actions {
                flex-direction: column;
            }

            .home-btn {
                width: 100%;
            }

        }

    </style>

</head>
